<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Spider</title>
  <desc id="desc">A three-dimensional geometric spider mark above a dark network grid.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="24" x2="1040" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset=".55" stop-color="#16152B"/>
      <stop offset="1" stop-color="#09121E"/>
    </linearGradient>
    <linearGradient id="top" x1="438" y1="87" x2="579" y2="171" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#A9B5D2"/>
    </linearGradient>
    <linearGradient id="left" x1="432" y1="129" x2="495" y2="245" gradientUnits="userSpaceOnUse">
